[project]
name = "dexdda"
version = "0.1.0"
description = "Local DEX-CEX arbitrage dashboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyJWT>=2.10,<3",
  "uvicorn>=0.34,<1",
  "websockets>=15,<17",
  "eth-account>=0.13,<0.15",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
dexdda = "app.main:main"
dexdda-smoke = "app.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
